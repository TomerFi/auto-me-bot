---
name: Bug Report
description: File a bug report
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also share, what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: runtime-information
    attributes:
      label: Runtime information
      description: Please provide: browser, OS, account/org/repo affected, and any other relevant environment details.
    validations:
      required: true

  - type: textarea
    id: log-output
    attributes:
      label: Relevant log output
      description: Please provide any relevant log output. Remember to redact sensitive information.
      render: shell
    validations:
      required: true

  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What steps should a maintainer take to reproduce the issue? Be as specific as possible.
    validations:
      required: true
