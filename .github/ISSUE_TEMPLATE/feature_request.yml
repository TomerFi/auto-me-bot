---
name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to suggest an idea!

  - type: textarea
    id: feature-idea
    attributes:
      label: What did you have in mind?
      description: Describe the feature in a few sentences.
    validations:
      required: true

  - type: textarea
    id: is-problem
    attributes:
      label: Are you trying to fix a problem?
      description: If so, please provide as much information as you can.

  - type: textarea
    id: implementation-idea
    attributes:
      label: Any implementation thoughts?
      description: Optional — any ideas on how this could be approached.
